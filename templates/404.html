<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Vivek Ray</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" />
  <style>
    body {
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 32%),
                  radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.18), transparent 28%),
                  #0f172a;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <div class="grid min-h-screen place-items-center px-6 py-12">
    <div class="max-w-2xl rounded-[32px] border border-white/10 bg-white/5 p-10 text-center backdrop-blur-xl">
      <p class="text-sm uppercase tracking-[0.3em] text-slate-400">404 Error</p>
      <h1 class="mt-6 text-6xl font-bold">Page Not Found</h1>
      <p class="mt-4 text-slate-300">The page you are looking for does not exist or has been moved.</p>
      <a href="/" class="mt-8 inline-flex rounded-full bg-gradient-to-r from-primary to-secondary px-7 py-3 font-semibold text-white shadow-glow hover:opacity-90">Back to Home</a>
    </div>
  </div>
</body>
</html>
